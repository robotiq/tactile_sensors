<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotiq Tactile Sensor Viewer</title>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Robotiq Tactile Sensor Viewer</h1>
        <div class="controls">
            <button id="reset-baseline">Reset Baseline</button>
            <label><input type="checkbox" id="raw-values"> Raw</label>
            <label><input type="checkbox" id="adaptive-range" checked> Adaptive scale</label>
            <button id="reset-imu-axes">Reset IMU Y</button>
        </div>
        <div id="status-bar">
            <span id="connection-status" class="status-disconnected">Disconnected</span>
            <span id="sample-count">Frame: 0</span>
        </div>
    </header>

    <main class="grid">
        <!-- Column headers -->
        <div class="corner"></div>
        <div class="col-head">Static pressure</div>
        <div class="col-head">Dynamic <span class="unit">(mV)</span></div>
        <div class="col-head">FFT <span class="unit">(Hz)</span></div>
        <div class="col-head">Accelerometer <span class="axis-key"><i class="ax-x"></i>X <i class="ax-y"></i>Y <i class="ax-z"></i>Z</span></div>
        <div class="col-head">Gyroscope <span class="axis-key"><i class="ax-x"></i>X <i class="ax-y"></i>Y <i class="ax-z"></i>Z</span></div>

        <!-- Finger 0 -->
        <div class="row-label"><span>Finger 0</span></div>
        <div class="cell static-cell"><div id="static-finger-0" class="plot"></div></div>
        <div class="cell"><div id="dynamic-time-0" class="plot"></div></div>
        <div class="cell"><div id="dynamic-fft-0" class="plot"></div></div>
        <div class="cell"><div id="imu-accel-0" class="plot"></div></div>
        <div class="cell"><div id="imu-gyro-0" class="plot"></div></div>

        <!-- Finger 1 -->
        <div class="row-label"><span>Finger 1</span></div>
        <div class="cell static-cell"><div id="static-finger-1" class="plot"></div></div>
        <div class="cell"><div id="dynamic-time-1" class="plot"></div></div>
        <div class="cell"><div id="dynamic-fft-1" class="plot"></div></div>
        <div class="cell"><div id="imu-accel-1" class="plot"></div></div>
        <div class="cell"><div id="imu-gyro-1" class="plot"></div></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
