<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotiq Tactile Sensor Viewer</title>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Robotiq Tactile Sensor Viewer</h1>
        <div class="controls">
            <button id="reset-baseline">Reset Baseline</button>
            <button id="zero-wrench">Zero Force</button>
            <label><input type="checkbox" id="raw-values"> Raw</label>
            <label><input type="checkbox" id="adaptive-range" checked> Adaptive scale</label>
        </div>
        <div id="status-bar">
            <span id="connection-status" class="status-disconnected">Disconnected</span>
            <span id="sample-count">Frame: 0</span>
        </div>
    </header>

    <main class="grid">
        <!-- A column per finger — its pad, and that finger's dynamic trace
             directly beneath it — then the gripper, spanning both rows.
             Finger 1 is on the left: the columns are ordered to match the
             hardware, not the index. The ids stay bound to the finger index,
             so this is purely a matter of where each column sits and nothing
             in app.js has to know about it. -->
        <div class="col-head">Finger 1</div>
        <div class="col-head">Finger 0</div>
        <div class="col-head">Gripper config and load <span class="unit">(2F-85)</span></div>

        <div class="cell"><div id="static-finger-1" class="plot"></div></div>
        <div class="cell"><div id="static-finger-0" class="plot"></div></div>

        <div class="cell gripper-cell">
            <div id="gripper-view"></div>
            <div class="overlay-note">
                Finger tilt estimated from the fingertip IMUs<br>
                <span class="dim">force and moment measured from the force/torque sensor (FT-300)</span>
            </div>
            <div id="gripper-readout">
                <span id="tip-readout-0"></span>
                <span id="wrench-readout"></span>
                <span id="tip-readout-1"></span>
            </div>
        </div>

        <div class="cell captioned">
            <span class="caption">Dynamic <span class="unit">(mV)</span></span>
            <div id="dynamic-time-1" class="plot"></div>
        </div>
        <div class="cell captioned">
            <span class="caption">Dynamic <span class="unit">(mV)</span></span>
            <div id="dynamic-time-0" class="plot"></div>
        </div>
    </main>

    <script src="gripper_geometry.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
