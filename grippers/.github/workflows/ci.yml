name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libserialport (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libserialport-dev

      - name: Install libserialport (macOS)
        if: runner.os == 'macOS'
        run: brew install libserialport

      # libserialport has no vcpkg port; MSYS2 packages it (UCRT64).
      - name: Set up MSYS2 with libserialport (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          pacboy: toolchain:p cmake:p ninja:p pkgconf:p libserialport:p

      - name: Configure, build, test
        if: runner.os != 'Windows'
        run: |
          cmake -S sdk_cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure

      - name: Configure, build, test (MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S sdk_cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure

  # A bare-metal cross-compile of the freestanding profile. No runner can run
  # it, so this is a compile-only guard; cortex-m55 stands in for "a real MCU
  # target" (it is what the SDK was brought up on). The whole core — the
  # threaded Gripper included — must compile with no threading support at all:
  # everything OS-flavored sits behind the injected Platform.
  cortex-m55:
    runs-on: ubuntu-latest
    env:
      CXXFLAGS: -std=c++17 -Isdk_cpp/include -Isdk_cpp/third_party/nanomodbus
                -mcpu=cortex-m55 -mthumb -fexceptions -Wall -Wextra -Werror
                -DGRIPPERS_HOSTED=0 -DGRIPPERS_BUILD_DEFAULT_SERIAL=0
    steps:
      - uses: actions/checkout@v4
      - name: Install the arm-none-eabi toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Compile the core
        run: |
          arm-none-eabi-g++ $CXXFLAGS -c -o /dev/null sdk_cpp/src/logger.cpp
          arm-none-eabi-g++ $CXXFLAGS -c -o /dev/null sdk_cpp/src/to_string.cpp
          arm-none-eabi-g++ $CXXFLAGS -c -o /dev/null sdk_cpp/src/freestanding/default_logger.cpp
          arm-none-eabi-g++ $CXXFLAGS -c -o /dev/null sdk_cpp/src/detail/gripper_modbus_client.cpp
          arm-none-eabi-g++ $CXXFLAGS -c -o /dev/null sdk_cpp/src/gripper.cpp

      # The reference ThreadX port, against a compile-only tx_api.h stand-in.
      # Keeps the committed stub honest and proves the port needs nothing beyond
      # the API surface it documents. The link job below is the real check.
      - name: Syntax-check the ThreadX port
        run: |
          printf '#include <threadx_platform.hpp>\nRobotiq::ports::ThreadXPlatform platform{};\n' > probe.cpp
          arm-none-eabi-g++ $CXXFLAGS -Isdk_cpp/ports/threadx -Isdk_cpp/ports/threadx/compile_stub -fsyntax-only probe.cpp

  # Links the threaded stack for an STM32N6-class target against REAL ThreadX,
  # which a compile cannot check: unresolved symbols, the unwinder -fexceptions
  # drags in, and the libc backing of steady_clock only appear at link time.
  # Everything here comes from public sources — no ST tooling, which is why
  # signing and flashing stay out of CI (see mono_firmware for those).
  threadx-link:
    runs-on: ubuntu-latest
    env:
      # ubuntu-24.04 ships gcc-arm-none-eabi 13.2; 22.04's 10.3 is too old for
      # the cortex-m55 flags.
      THREADX_REF: v6.5.1.202602a_rel
      FIXTURE: sdk_cpp/ports/threadx/link_test
      CXXFLAGS: -std=c++17 -mcpu=cortex-m55 -mthumb -Os -ffunction-sections
                -fdata-sections -fexceptions -fno-rtti -fno-threadsafe-statics
                -Wall -Wextra -Werror
                -DGRIPPERS_HOSTED=0 -DGRIPPERS_BUILD_DEFAULT_SERIAL=0
    steps:
      - uses: actions/checkout@v4
      - name: Install the arm-none-eabi toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi ninja-build

      - name: Build ThreadX for cortex-m55
        run: |
          git clone --depth 1 --branch "$THREADX_REF" \
            https://github.com/eclipse-threadx/threadx.git threadx-src
          cp "$FIXTURE/threadx_cortex_m55.cmake" threadx-src/cmake/
          cmake -S threadx-src -B threadx-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/threadx_cortex_m55.cmake
          cmake --build threadx-build -j 4
          test -f threadx-build/libthreadx.a

      # steady_clock's backing is a property of the multilib, and nosys.specs
      # stubs the missing one silently instead of failing the link — so an
      # unimplemented backing shows up as a frozen clock on hardware, not here.
      # Assert which symbol this toolchain actually requires.
      - name: Assert the steady_clock backing the glue must implement
        run: |
          lib=$(arm-none-eabi-g++ -mcpu=cortex-m55 -mthumb -print-file-name=libstdc++.a)
          mkdir -p probe-chrono
          arm-none-eabi-ar x "$lib" chrono.o --output=probe-chrono
          undefined=$(arm-none-eabi-nm -C probe-chrono/chrono.o | sed -n 's/^ *U //p')
          echo "$undefined"
          if echo "$undefined" | grep -qx gettimeofday; then
            echo "steady_clock is backed by gettimeofday - newlib_glue.c implements it"
          elif echo "$undefined" | grep -qx clock_gettime; then
            echo "steady_clock is backed by clock_gettime - newlib_glue.c implements it"
          else
            echo "::error::steady_clock needs neither gettimeofday nor clock_gettime on this"
            echo "::error::toolchain. Find its backing and implement it in $FIXTURE/newlib_glue.c,"
            echo "::error::or every SDK timeout will silently stop advancing on hardware."
            exit 1
          fi

      - name: Link the freestanding image
        run: |
          inc="-Isdk_cpp/include -Isdk_cpp/third_party/nanomodbus -Isdk_cpp/ports/threadx
               -Ithreadx-src/common/inc -Ithreadx-src/ports/cortex_m55/gnu/inc"
          cflags="-std=c11 -mcpu=cortex-m55 -mthumb -Os -Wall -Wextra -Werror"
          mkdir -p obj
          objects=""
          for src in sdk_cpp/src/gripper.cpp \
                     sdk_cpp/src/detail/gripper_modbus_client.cpp \
                     sdk_cpp/src/logger.cpp \
                     sdk_cpp/src/to_string.cpp \
                     sdk_cpp/src/freestanding/default_logger.cpp \
                     "$FIXTURE/main.cpp"; do
            obj="obj/$(basename "$src").o"
            arm-none-eabi-g++ $CXXFLAGS $inc -c "$src" -o "$obj"
            objects="$objects $obj"
          done
          for src in sdk_cpp/third_party/nanomodbus/nanomodbus.c "$FIXTURE/newlib_glue.c"; do
            obj="obj/$(basename "$src").o"
            arm-none-eabi-gcc $cflags $inc -c "$src" -o "$obj"
            objects="$objects $obj"
          done
          # An explicit object list, never a glob: the steady_clock probe leaves
          # libstdc++'s own chrono.o lying about, and it must not be linked in.
          arm-none-eabi-g++ -mcpu=cortex-m55 -mthumb -Os -Wl,--gc-sections \
            --specs=nosys.specs --specs=nano.specs \
            $objects threadx-build/libthreadx.a -o n6.elf
          arm-none-eabi-size n6.elf

      # A link that garbage-collected the stack away would prove nothing.
      - name: Assert the stack really is in the image
        run: |
          symbols=$(arm-none-eabi-nm -C n6.elf)
          for want in '_tx_thread_create' 'ThreadXPlatform::spawn' 'Gripper::Gripper' '__cxa_throw'; do
            echo "$symbols" | grep -q "$want" \
              || { echo "::error::$want missing from the linked image"; exit 1; }
            echo "present: $want"
          done

  # The CMake wiring of the freestanding profile, with the host compiler: the
  # configure must not require libserialport or Threads, and must select the
  # freestanding TUs.
  freestanding-cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build the library with the hosted pieces off
        run: |
          cmake -S sdk_cpp -B build-freestanding -DCMAKE_BUILD_TYPE=Release \
            -DGRIPPERS_HOSTED=OFF -DGRIPPERS_BUILD_DEFAULT_SERIAL=OFF -DGRIPPERS_BUILD_FAKE=OFF
          cmake --build build-freestanding -j 4

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          git ls-files ':(glob)sdk_cpp/include/**/*.hpp' ':(glob)sdk_cpp/src/**/*.[ch]pp' ':(glob)sdk_cpp/tests/**/*.[ch]pp' ':(glob)sdk_cpp/examples/**/*.cpp' \
            | xargs clang-format --dry-run --Werror

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libserialport-dev gcovr
      - name: Configure
        run: >
          cmake -S sdk_cpp -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage
          -DGRIPPERS_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Coverage report
        run: >
          gcovr --root . --filter 'sdk_cpp/(include|src)/' build
          --print-summary --xml coverage.xml --html-details coverage.html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.html

  # The one status check branch protection requires. Depends on every job
  # above, so the rule never has to change when jobs are added or renamed:
  # add the new job here instead. `if: always()` makes it run even when a
  # dependency failed; anything but success — failure, cancelled, skipped —
  # fails the gate.
  #
  #   build-and-test      host build + unit tests on Linux, macOS, Windows
  #   cortex-m55          bare-metal cross-compile of the freestanding profile
  #   threadx-link        links the threaded stack against real ThreadX
  #   freestanding-cmake  freestanding CMake wiring with the host compiler
  #   format              clang-format check
  #   coverage            gcovr report
  ci-gate:
    if: always()
    needs: [build-and-test, cortex-m55, threadx-link, freestanding-cmake, format, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
