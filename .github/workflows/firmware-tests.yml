name: Firmware tests

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-tests.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-tests.yml"

permissions:
  contents: read

jobs:
  bootloader-host:
    name: bootloader_host.py (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest firmware/tests -v
