name: tsf

# No path filters: tsf-ci-gate is a required check on main, and a workflow
# skipped by a path filter would leave it pending on every PR that touches
# only another product.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# The TSF-85 tools live in tsf/ of robotiq-sdk: every run step starts there.
defaults:
  run:
    working-directory: tsf

jobs:
  # The C++ SDK in Release. Quick_start and the two test programs need a
  # sensor to run, so this job builds them and stops there.
  sdk-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libserialport
        run: sudo apt-get update && sudo apt-get install -y libserialport-dev
      - name: Configure and build
        run: |
          cmake -S sdk_cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j 4

  # The Python tools on the oldest Python the launchers accept and on a
  # current one: byte-compile everything, then run the web viewer on
  # synthetic data (tools/smoke_web_viewer.py).
  python:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the quickstart requirements
        run: python -m pip install -r sensor_quickstart/requirements.txt
      - name: Byte-compile
        run: python -m compileall -q sensor_quickstart firmware
      - name: Web viewer smoke test
        run: python sensor_quickstart/tools/smoke_web_viewer.py

  # The one status check branch protection requires. Depends on every job
  # above: add new jobs here, never to the rule. `if: always()` makes it run
  # when a dependency failed; anything but success fails the gate.
  tsf-ci-gate:
    if: always()
    needs: [sdk-cpp, python]
    runs-on: ubuntu-latest
    # No checkout in this job, so tsf/ does not exist here: run from the
    # workspace instead of the workflow default.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
